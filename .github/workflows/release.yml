name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build component zip
        run: |
          cd custom_components
          zip -r ../thunerwetter.zip thunerwetter
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: thunerwetter.zip
          generate_release_notes: true
